# Configuración de nginx para whatsremisse.tech
#
# POR QUÉ ESTÁ EN EL REPOSITORIO: la copia que vivía en el servidor se perdió y sin ella la app
# recibía la web en lugar de datos («No hubo respuesta del servidor»). Aquí queda versionada y se
# instala con una línea, sin pegar archivos largos (pegar 5 KB de golpe deforma el texto).
#
# Qué trae:
#   - el certificado de Let's Encrypt (tal como lo dejó Certbot),
#   - la web (single page app) con la carpeta del build,
#   - LAS RUTAS DEL BACKEND: /rest, /auth, /storage y /realtime hacia `supabase-envoy` (127.0.0.1:8000),
#   - WebSocket para el tiempo real y 50 MB de margen para subir fotos y notas de voz.
#
# Instalar (después de `git pull`):
#   sudo cp deploy/nginx-default.conf /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Si algún día Certbot renueva y añade líneas, volver a copiar este archivo es seguro: lo único que
# cambia son las rutas del backend y el tamaño de subida.

server {
    server_name whatsremisse.tech www.whatsremisse.tech;

    root /opt/data/whatsremisse/frontend/web-build;
    index index.html;

    # Subidas de la app (fotos y notas de voz): sin esto, las subidas grandes fallan.
    client_max_body_size 50m;

    # ------------------------------------------------------------------
    # Las rutas del BACKEND: todo esto lo atiende la puerta de Supabase
    # (el contenedor `supabase-envoy`, que escucha en el 8000).
    # Faltaban cuando se perdió la configuración: la app recibía el HTML
    # de la web en lugar de datos ("No hubo respuesta del servidor").
    # ------------------------------------------------------------------

    # Datos (PostgREST)
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Entrar y registrarse (GoTrue)
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Archivos (fotos de perfil, de empresa y del chat, notas de voz)
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        client_max_body_size 50m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Tiempo real: la conexión que mantiene los chats al día (es un WebSocket)
    location /realtime/v1/websocket {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # La web (single page app): todo lo demás lo sirve la carpeta del build.
    # ------------------------------------------------------------------
    location / {
        # El HTML se revalida siempre: es lo que hace que un teléfono se entere de que hay una
        # versión nueva (24-09-2026). Sin esto, el navegador puede servir el index.html viejo de su
        # caché y la app no se actualiza aunque se recargue.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # El sello de versión: NUNCA desde la caché, o el aviso de actualización no llegaría.
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Cache de los archivos compilados
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/whatsremisse.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whatsremisse.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.whatsremisse.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = whatsremisse.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name whatsremisse.tech www.whatsremisse.tech;
    return 404; # managed by Certbot
}
